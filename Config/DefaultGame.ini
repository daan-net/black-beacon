; ============================================================
; BLACK BEACON - DefaultGame.ini
; ============================================================
; Gameplay tunables. Every value here is a `config`-tagged
; UPROPERTY on the class in square brackets, so it is auditable
; as text AND editable in the editor's project settings/details.

; ------------------------------------------------------------
; Objective chain (text/data-driven).
; The order declared here is the order the player experiences.
; ------------------------------------------------------------
[/Script/BlackBeacon.BBObjectiveSystem]
+ObjectiveChain=(Id="BB_OBJ_ARRIVE",Text="Arrive at the island landing point.")
+ObjectiveChain=(Id="BB_OBJ_ENTER_LIGHTHOUSE",Text="Enter the lighthouse.")
+ObjectiveChain=(Id="BB_OBJ_FIND_GENERATOR",Text="Find the generator in the engine annex.")
+ObjectiveChain=(Id="BB_OBJ_START_GENERATOR",Text="Start the generator.")
+ObjectiveChain=(Id="BB_OBJ_RESTORE_POWER",Text="Restore lighthouse power.")
+ObjectiveChain=(Id="BB_OBJ_CLIMB",Text="Climb to the lantern room.")
+ObjectiveChain=(Id="BB_OBJ_START_LIGHTHOUSE",Text="Start the lighthouse beam.")
+ObjectiveChain=(Id="BB_OBJ_AIM_BEAM",Text="Take control of the beam and sweep the island.")
+ObjectiveChain=(Id="BB_OBJ_DISCOVER_ANOMALY",Text="Find what the beam reveals.")

; ------------------------------------------------------------
; GameMode bootstrap (procedural greybox world for the slice)
; ------------------------------------------------------------
[/Script/BlackBeacon.BlackBeaconGameMode]
bBuildProceduralBootstrapWorld=True
BootstrapPlayerStart=(Translation=(X=-4500.0,Y=-600.0,Z=240.0),Rotation=(Pitch=0.0,Yaw=-30.0,Roll=0.0),Scale3D=(X=1.0,Y=1.0,Z=1.0))

; ------------------------------------------------------------
; Lighthouse beam defaults
; ------------------------------------------------------------
[/Script/BlackBeacon.BBLighthouseBeamComponent]
AutoRotationDegPerSec=6.0
ManualRotationDegPerSec=60.0
BeamRangeCm=180000.0
BeamHalfAngleDeg=6.0
BeamMaxIntensityLumens=8000000.0
BeamColor=(R=1.0,G=0.92,B=0.78,A=1.0)
bStartInAutoRotation=True
bVolumetricLight=True

; ------------------------------------------------------------
; Lighthouse machinery defaults
; ------------------------------------------------------------
[/Script/BlackBeacon.BBLighthouseController]
bAutoStartBeamWhenPowered=False

; ------------------------------------------------------------
; Generator defaults
; ------------------------------------------------------------
[/Script/BlackBeacon.BBGeneratorComponent]
SpinUpSeconds=4.0
MaxWatts=12000.0

; ------------------------------------------------------------
; Beam reveal defaults (the signature anomaly example)
; ------------------------------------------------------------
[/Script/BlackBeacon.BBBeamRevealComponent]
DefaultRevealDelay=2.5
DefaultFadeTime=1.5
DefaultMinBeamIntensity=0.25
DefaultVisibilityDuration=0.0
bDefaultPersistent=True

; ------------------------------------------------------------
; Weather controller defaults
; ------------------------------------------------------------
[/Script/BlackBeacon.BBWeatherController]
InitialPhase=EBBWeatherPhase::Rain
TransitionSeconds=8.0