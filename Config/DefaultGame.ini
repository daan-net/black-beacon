; ============================================================
; BLACK BEACON - DefaultGame.ini
; ============================================================
; Gameplay tunables. Every value here is a `config`-tagged
; UPROPERTY on the class in square brackets, so it is auditable
; as text AND editable in the editor's project settings/details.

; ------------------------------------------------------------
; Objective chain (text/data-driven).
; The order declared here is the order the player experiences.
; ------------------------------------------------------------
[/Script/BlackBeacon.BBObjectiveSystem]
+ObjectiveChain=(Id="BB_OBJ_ARRIVE",Text="Wake on the island shore.")
+ObjectiveChain=(Id="BB_OBJ_ENTER_LIGHTHOUSE",Text="Enter the lighthouse.",Prereqs=("BB_OBJ_ARRIVE"))
+ObjectiveChain=(Id="BB_OBJ_FIND_GENERATOR",Text="Find the generator in the engine annex.",Prereqs=("BB_OBJ_ENTER_LIGHTHOUSE"))
+ObjectiveChain=(Id="BB_OBJ_START_GENERATOR",Text="Start the generator.",Prereqs=("BB_OBJ_FIND_GENERATOR"))
+ObjectiveChain=(Id="BB_OBJ_RESTORE_POWER",Text="Restore lighthouse power.",Prereqs=("BB_OBJ_START_GENERATOR"))
+ObjectiveChain=(Id="BB_OBJ_CLIMB",Text="Climb to the lantern room.",Prereqs=("BB_OBJ_RESTORE_POWER"))
+ObjectiveChain=(Id="BB_OBJ_START_LIGHTHOUSE",Text="Start the lighthouse beam.",Prereqs=("BB_OBJ_CLIMB"))
+ObjectiveChain=(Id="BB_OBJ_AIM_BEAM",Text="Take control of the beam and sweep the island.",Prereqs=("BB_OBJ_START_LIGHTHOUSE"))
+ObjectiveChain=(Id="BB_OBJ_DISCOVER_ANOMALY",Text="Find what the beam reveals.",Prereqs=("BB_OBJ_AIM_BEAM"))

; ------------------------------------------------------------
; GameMode bootstrap (off for the persistent M0.2 map; available to dev maps)
; ------------------------------------------------------------
[/Script/BlackBeacon.BBlackBeaconGameMode]
bBuildProceduralBootstrapWorld=False
BootstrapPlayerStart=(Translation=(X=-4500.0,Y=-600.0,Z=240.0),Rotation=(Pitch=0.0,Yaw=-30.0,Roll=0.0),Scale3D=(X=1.0,Y=1.0,Z=1.0))

; ------------------------------------------------------------
; Lighthouse beam defaults
; ------------------------------------------------------------
[/Script/BlackBeacon.BBLighthouseBeamComponent]
AutoRotationDegPerSec=6.0
ManualRotationDegPerSec=60.0
BeamRangeCm=180000.0
BeamHalfAngleDeg=6.0
BeamMaxIntensityLumens=1200.0
BeamVolumetricScatteringIntensity=4.0
BeamVisualLengthCm=7000.0
BeamVisualOpacity=0.04
BeamOriginGlowLumens=300.0
BeamColor=(R=1.0,G=0.72,B=0.42,A=1.0)
bStartInAutoRotation=True
bVolumetricLight=True

; ------------------------------------------------------------
; Lighthouse machinery defaults
; ------------------------------------------------------------
[/Script/BlackBeacon.BBLighthouseController]
bAutoStartBeamWhenPowered=False

; ------------------------------------------------------------
; Generator defaults
; ------------------------------------------------------------
[/Script/BlackBeacon.BBGeneratorComponent]
SpinUpSeconds=4.0
MaxWatts=12000.0

; ------------------------------------------------------------
; Beam reveal defaults (the signature anomaly example)
; ------------------------------------------------------------
[/Script/BlackBeacon.BBBeamRevealComponent]
DefaultRevealDelay=2.5
DefaultFadeTime=1.5
DefaultMinBeamIntensity=0.25
DefaultVisibilityDuration=0.0
bDefaultPersistent=True

; ------------------------------------------------------------
; Weather controller defaults
; ------------------------------------------------------------
[/Script/BlackBeacon.BBWeatherController]
MoonlightLux=1.5
InitialPhase=EBBWeatherPhase::Rain
TransitionSeconds=8.0
+Palette=(Phase=EBBWeatherPhase::Clear,FogDensity=0.001,WindStrength=0.1,RainIntensity=0.0,Cloudiness=0.2)
+Palette=(Phase=EBBWeatherPhase::Fog,FogDensity=0.03,WindStrength=0.2,RainIntensity=0.0,Cloudiness=0.7)
+Palette=(Phase=EBBWeatherPhase::Rain,FogDensity=0.0015,WindStrength=0.5,RainIntensity=0.6,Cloudiness=0.85,FogColor=(R=0.02,G=0.035,B=0.05,A=1.0))
+Palette=(Phase=EBBWeatherPhase::Storm,FogDensity=0.04,WindStrength=0.9,RainIntensity=1.0,Cloudiness=1.0)
[/Script/BlackBeacon.BBlackBeaconPlayerController]
MouseYawDegreesPerCount=0.35
MousePitchDegreesPerCount=0.18
ManualAimSensitivity=0.22
OpeningViewRotation=(Pitch=-2.0,Yaw=8.0,Roll=0.0)
OpeningFadeSeconds=2.5

[/Script/BlackBeacon.BBlackBeaconPlayerCharacter]
WalkSpeed=400.0
SprintSpeed=700.0
CrouchSpeed=190.0
StandEyeHeightCm=152.0
CrouchEyeHeightCm=100.0

[/Script/BlackBeacon.BBInteractionComponent]
TraceDistance=600.0
TraceRadius=24.0
TraceInterval=0.1

[/Script/BlackBeacon.BBProceduralWorld]
StairFillLumens=350.0
StairFillRadiusCm=680.0
StairFillColor=(R=1.0,G=0.72,B=0.48,A=1.0)
