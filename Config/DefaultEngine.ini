; ============================================================
; BLACK BEACON - DefaultEngine.ini
; ============================================================
; Engine-level configuration. Tunables that belong to gameplay
; systems live in DefaultGame.ini instead.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/BlackBeacon/Maps/L_BlackBeacon_M02
EditorStartupMap=/Game/BlackBeacon/Maps/L_BlackBeacon_M02
GlobalDefaultGameMode=/Script/BlackBeacon.BBlackBeaconGameMode

[/Script/Engine.RendererSettings]
; Volumetric fog - the lighthouse beam is a volume, not a sprite.
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=6
r.VolumetricFog.GridSizeZ=128
r.VolumetricFog.TemporalReprojection=1
; Fixed exposure keeps the beam and its impact comparable across the test views.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=1
r.DefaultFeature.AntiAliasing=2
r.DefaultFeature.MotionBlur=True
; Virtual shadow maps (UE5) for long, high-quality shadows.
r.Shadow.Virtual.Enable=1
; Lumen GI is the default path; keep it on for believable interiors.
r.Lumen.DiffuseIndirect.Allow=1

[/Script/Engine.GameViewportClient]
NearClipPlane=15.0

; V0.4: half-resolution cloud tracing, full-resolution reconstruction, native TAA.
; Engine 5.8 source: VolumetricRenderTarget.cpp / VolumetricFog.cpp.
r.VolumetricRenderTarget.Mode=1
r.VolumetricCloud.ViewRaySampleMaxCount=768
r.VolumetricFog.HistoryWeight=0.9
r.VolumetricFog.HistoryMissSupersampleCount=8
r.AntiAliasingMethod=2
r.TemporalAA.Quality=2
r.ScreenPercentage=100

; Vulkan descriptor compatibility for the RTX 2060 / NVIDIA 595.91.07.
r.Vulkan.Bindless.PreferredExtension=1
; PC-first: keep LOD/view-distance generous for the slice.
r.ViewDistanceScale=1.0
r.SkeletalMeshLODBias=0
r.MaterialQualityLevel=1

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=01A0CD32CDB3761F8A82C27DF1A76A5E
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
SpatializationPlugin=
SourceDataOverridePlugin=
ReverbPlugin=
OcclusionPlugin=
SoundCueCookQualityIndex=-1
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM5
bGenerateNaniteFallbackMeshes=True
RayTracingMode=Full
bMultiTargetFormat_DXT=True
bMultiTargetFormat_ASTC=True
bMultiTargetFormat_ETC2=True
TextureFormatPriority_ETC2=0.200000
TextureFormatPriority_DXT=0.600000
TextureFormatPriority_ASTC=0.900000




[SystemSettings]
; Skip PSO precaching of global shaders; material PSO precaching stays on.
; One global compute shader (subsurface + ShaderPrint, Development builds) emits
; SPIR-V that stores an image handle into a uint local. Mesa RADV/ACO segfaults
; compiling it (aco::visit_intrinsic -> _isel_err); only precaching ever builds it.
; Replaces r.ShaderPipelineCache.bAsyncCompile / r.PSOPrecache.Enable, which do not
; exist in UE 5.8 ("deferred - dummy variable created" in the log).
r.PSOPrecache.GlobalShaders=0

