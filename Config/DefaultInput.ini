; ============================================================
; BLACK BEACON - DefaultInput.ini
; ============================================================
; Enhanced Input bindings are created in C++ (BBPlayerController)
; so this project has no empty .uasset dependencies for input.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
bCaptureMouseOnLaunch=True
bEnableMouseSmoothing=False
bEnableFOVScaling=False
bEnableLegacyInputScales=False

; Escape quits. The mouse is captured permanently and there is no pause/quit menu
; yet. DebugExecBindings exist only in non-Shipping builds.
[/Script/Engine.PlayerInput]
+DebugExecBindings=(Key=Escape,Command="quit")
